apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gurraiah-app
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Balachandru-ai/Gurraiah123-.git
    targetRevision: main
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
